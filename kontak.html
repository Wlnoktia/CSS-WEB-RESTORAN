<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontak - Goodlife Kitchen</title>
    <link rel="stylesheet" href="style.css"> 
</head>
<body class="body-kontak">
    <div class="page-container">

        <header class="header-kontak">
            <img src="images/logo.png" alt="Logo Healthy Food" class="logo">
            <h1>🌿 Goodlife Kitchen 🍃</h1>
            <p class="tagline"><small>Hidup lebih sehat, rasa tetap nikmat</small></p>
            <hr class="divider">
            <nav>
                <a href="index.html">Beranda</a> 
                <a href="menu.html">Menu</a> 
                <a href="kontak.html">Kontak</a>
            </nav>
            <hr class="divider">
        </header>

        <main class="kontak-main">
            <h2>📞 Hubungi Kami 📞</h2>
            
            <form action="#" method="POST">
                <div class="form-group">
                    <label for="nama">Nama Lengkap:</label>
                    <input type="text" id="nama" name="nama" required>
                </div>
                
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                </div>
                
                <div class="form-group">
                    <label for="pesan">Pesan:</label>
                    <textarea id="pesan" name="pesan" required></textarea>
                </div>
                
                <div style="text-align: left;">
                    <input type="submit" value="Kirim" class="submit-btn">
                </div>
            </form>
        </main>

        <footer class="main-footer">
            <div class="contact-details">
                <p>📍 Jl. Sehat No.1 - Telp: (021) 1234-5678 - ⏰ Buka 08:00 - 20:00</p>
                <p class="link-footer">
                    <a href="#">Instagram</a> | <a href="#">WhatsApp</a>
                </p>
            </div>
            
            <div class="closing-message">
                <p>💚 Terima kasih telah memilih makanan sehat 💚</p>
            </div>

            <div class="copyright">
                <p>&copy; 2025 Goodlife Kitchen. All rights reserved.</p>
            </div>
        </footer>
    </div>
</body>
</html>
